services:
  mcp-server:
    container_name: mcp-server
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    ports:
      - 8000:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/').read()"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: ${RESTART_POLICY:-no}